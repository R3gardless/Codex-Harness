# Optional project config. All servers are dormant until explicitly enabled.
# Merge only the required table into the host's supported configuration surface.
# No model/provider, approval, sandbox, or credential settings are changed here.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false
enabled_tools = ["resolve-library-id", "query-docs"]
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.heroui]
command = "npx"
args = ["-y", "@heroui/react-mcp@1.1.3"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers.openai_docs]
url = "https://developers.openai.com/mcp"
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.aws_knowledge]
url = "https://knowledge-mcp.global.api.aws"
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Account access: requires an authorized profile and least-privilege IAM.
# The endpoint region and operation region need not be the same.
# Versions are pinned from registry metadata; runtime/authentication are unverified.
[mcp_servers.aws_resources]
command = "uvx"
args = ["mcp-proxy-for-aws-cli@1.7.0", "https://aws-mcp.us-east-1.api.aws/mcp", "--profile", "harness-readonly", "--region", "us-east-1", "--read-only", "--disable-telemetry"]
# Prevent an inherited multi-profile setting from overriding --profile.
env = { AWS_MCP_PROXY_PROFILES = "" }
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 60

# Account access: use an authorized tenant/subscription and scoped Reader role.
# Only resource-group discovery is exposed initially. Add namespaces deliberately.
[mcp_servers.azure_resources]
command = "npx"
args = ["-y", "@azure/mcp@3.0.0", "server", "start", "--read-only", "--mode", "namespace", "--namespace", "group"]
env = { AZURE_MCP_COLLECT_TELEMETRY = "false" }
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 60
